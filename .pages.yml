# Pages CMS panel (app.pagescms.org): lets Darshi edit the main photos, reviews, traveller photos, places, routes, the FAQ, the "before/arrival/during" lists and the car details from his phone.
# Each entry edits one file in data/. The website reads those files, so the design never changes.
media:
  input: img
  output: img
  categories: [image]
  rename: safe

content:
  - name: photos
    label: Main photos
    type: file
    path: data/photos.json
    format: json
    fields:
      - name: hero
        label: "Photo at the top (it is also the photo WhatsApp shows when the link is shared)"
        type: object
        fields:
          - name: photo
            label: Photo
            type: image
          - name: description
            label: What the photo shows, in English (e.g. Darshi with travellers in Ella)
            type: string
      - name: about
        label: "About me"
        type: object
        fields:
          - name: photo
            label: Photo
            type: image
          - name: description
            label: What the photo shows, in English (e.g. Darshi with travellers in Ella)
            type: string
      - name: card_route
        label: "How we'll travel · 1. We plan the route together"
        type: object
        fields:
          - name: photo
            label: Photo
            type: image
          - name: description
            label: What the photo shows, in English (e.g. Darshi with travellers in Ella)
            type: string
      - name: card_tips
        label: "How we'll travel · 2. Recommendations along the way"
        type: object
        fields:
          - name: photo
            label: Photo
            type: image
          - name: description
            label: What the photo shows, in English (e.g. Darshi with travellers in Ella)
            type: string
      - name: card_train
        label: "How we'll travel · 3. The train to Ella"
        type: object
        fields:
          - name: photo
            label: Photo
            type: image
          - name: description
            label: What the photo shows, in English (e.g. Darshi with travellers in Ella)
            type: string
      - name: car_outside
        label: "The car · outside"
        type: object
        fields:
          - name: photo
            label: Photo
            type: image
          - name: description
            label: What the photo shows, in English (e.g. Darshi with travellers in Ella)
            type: string
      - name: car_inside
        label: "The car · inside"
        type: object
        fields:
          - name: photo
            label: Photo
            type: image
          - name: description
            label: What the photo shows, in English (e.g. Darshi with travellers in Ella)
            type: string
      - name: car_3
        label: "The car · photo 3"
        type: object
        fields:
          - name: photo
            label: Photo
            type: image
          - name: description
            label: What the photo shows, in English (e.g. Darshi with travellers in Ella)
            type: string

  - name: reviews
    label: Reviews
    type: file
    path: data/reviews.json
    format: json
    list: true
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: from_es
        label: Country or city, in Spanish (e.g. España)
        type: string
      - name: from_en
        label: Country or city, in English (e.g. Spain)
        type: string
      - name: trip_es
        label: Type of trip, in Spanish (optional, e.g. 12 días)
        type: string
      - name: trip_en
        label: Type of trip, in English (optional, e.g. 12 days)
        type: string
      - name: original_language
        label: Language the review was written in
        type: select
        required: true
        options:
          values:
            - name: es
              label: Spanish
            - name: en
              label: English
            - name: fr
              label: French
            - name: de
              label: German
            - name: it
              label: Italian
      - name: original
        label: Review, exactly as they wrote it
        type: text
        required: true
      - name: spanish
        label: Spanish translation (leave empty if the review is in Spanish)
        type: text
      - name: english
        label: English translation (leave empty if the review is in English)
        type: text
      - name: photo
        label: Photo of them with you (only with their permission)
        type: image
      - name: featured
        label: Show among the first 4 reviews
        type: boolean

  - name: travellers
    label: Photos with travellers
    type: file
    path: data/travellers.json
    format: json
    list: true
    fields:
      - name: photo
        label: Photo
        type: image
        required: true
      - name: description
        label: Short description in English (e.g. Darshi with a family in Ella)
        type: string

  - name: places
    label: Places along the way
    type: file
    path: data/places.json
    format: json
    list: true
    fields:
      - name: photo
        label: Photo (only your own photos)
        type: image
        required: true
      - name: name_es
        label: Name of the place in Spanish (e.g. Plantaciones de té)
        type: string
      - name: name_en
        label: Name of the place in English (e.g. Tea plantations)
        type: string
      - name: by
        label: Who took the photo (the traveller's name, e.g. Claudia Villa). Leave empty if you took it
        type: string
      - name: by_from_es
        label: Their country in Spanish (e.g. España)
        type: string
      - name: by_from_en
        label: Their country in English (e.g. Spain)
        type: string

  - name: routes
    label: Routes
    type: file
    path: data/routes.json
    format: json
    list: true
    fields:
      - name: name_es
        label: Short name for the button, in Spanish (e.g. Hasta Arugam Bay)
        type: string
      - name: name_en
        label: Short name for the button, in English (e.g. To Arugam Bay)
        type: string
      - name: who
        label: Who travelled (e.g. Amaya). Leave empty for a route you suggest
        type: string
      - name: days
        label: Number of days (optional)
        type: string
      - name: type_es
        label: Type of trip or short note, in Spanish (e.g. pareja, familia)
        type: string
      - name: type_en
        label: Type of trip or short note, in English (e.g. couple, family)
        type: string
      - name: stops
        label: "Stops in order, separated by · (e.g. Aeropuerto · Sigiriya · Kandy · Ella · Yala / Udawalawe · Mirissa). Use / for either place"
        type: string
        required: true

  - name: faq
    label: Questions (FAQ)
    type: file
    path: data/faq.json
    format: json
    list: true
    fields:
      - name: question_es
        label: Question in Spanish (use tú, e.g. ¿Se deja propina?)
        type: string
        required: true
      - name: question_en
        label: Question in English
        type: string
      - name: answer_es
        label: Your answer in Spanish. Leave an empty line between paragraphs
        type: text
        required: true
      - name: answer_en
        label: Your answer in English. Leave an empty line between paragraphs
        type: text

  - name: help
    label: "Before, on arrival and during the trip"
    type: file
    path: data/help.json
    format: json
    fields:
      - name: before
        label: Before the trip
        type: object
        list: true
        fields:
          - name: es
            label: In Spanish
            type: string
          - name: en
            label: In English
            type: string
      - name: arrival
        label: On arrival
        type: object
        list: true
        fields:
          - name: es
            label: In Spanish
            type: string
          - name: en
            label: In English
            type: string
      - name: during
        label: During the trip
        type: object
        list: true
        fields:
          - name: es
            label: In Spanish
            type: string
          - name: en
            label: In English
            type: string

  - name: car
    label: The car (details)
    type: file
    path: data/car.json
    format: json
    fields:
      - name: specs
        label: Car details (one line each)
        type: object
        list: true
        fields:
          - name: label_es
            label: Name in Spanish (e.g. Pasajeros)
            type: string
          - name: label_en
            label: Name in English (e.g. Passengers)
            type: string
          - name: value_es
            label: Detail in Spanish (e.g. 4 - 1 delante y 3 detrás)
            type: string
          - name: value_en
            label: Detail in English (e.g. 4 - 1 in the front, 3 at the back)
            type: string
      - name: note_es
        label: Short sentence under the details, in Spanish
        type: string
      - name: note_en
        label: Short sentence under the details, in English
        type: string
