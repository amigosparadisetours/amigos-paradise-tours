# Shrinks any photo in img/ that is too big for the web (more than 1600 px or 800 KB),
# so Darshi can upload photos straight from his phone through the panel.
name: Optimize photos

on:
  push:
    branches: [main]
    paths: ['img/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Shrink big photos
        run: |
          shopt -s nullglob nocaseglob
          for f in img/*.jpg img/*.jpeg img/*.png img/*.webp; do
            size=$(stat -c%s "$f")
            read -r w h < <(identify -format '%w %h\n' "$f[0]")
            if [ "$size" -gt 819200 ] || [ "$w" -gt 1600 ] || [ "$h" -gt 1600 ]; then
              echo "Optimizing $f (${w}x${h}, ${size} bytes)"
              mogrify -auto-orient -resize '1600x1600>' -strip -quality 80 "$f"
            fi
          done

      - name: Save and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img
          if git diff --cached --quiet; then
            echo "All photos are already small."
          else
            git commit -m "Optimize photos for the web"
            git push
            # A push made by this workflow doesn't trigger the website build by itself, so ask for one.
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
